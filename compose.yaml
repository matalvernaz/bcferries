services:
  bcferries:
    image: ghcr.io/matalvernaz/bcferries:latest
    container_name: bcferries
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
      - AIS_API_KEY=${AIS_API_KEY}
      - BCF_CACHE_DIR=/app/data/schedules
    volumes:
      # Scraped timetables must outlive the container: the upstream schedule
      # pages go behind a Queue-it waiting room during holiday surges, and a
      # restart while the wall is up would otherwise leave the app with none.
      - ./data:/app/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  traefik:
    external: true
